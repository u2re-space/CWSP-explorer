<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <!-- WHY: must match `--ui-win-titlebar-bg` or browser chrome ≠ in-page titlebar. -->
        <meta name="theme-color" content="#1a2233" media="(prefers-color-scheme: dark)" />
        <meta name="theme-color" content="#eef1f7" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#1a2233" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <link rel="manifest" href="/pwa/manifest.json" />
        <link rel="icon" type="image/svg+xml" href="/pwa/icons/icon.svg" />
        <link rel="icon" type="image/png" sizes="512x512" href="/pwa/icons/icon.png" />
        <link rel="apple-touch-icon" href="/pwa/icons/apple-touch-icon.png" />
        <title>CWSP Explorer</title>
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }
            html {
                -webkit-text-size-adjust: 100%;
                height: 100%;
                color-scheme: light dark;
            }
            body {
                margin: 0;
                min-height: 100%;
                padding: 0;
                width: 100dvw;
                height: 100dvh;
                overflow: hidden;
                background: light-dark(#eef1f7, #1a2233);
            }
            #app {
                width: 100dvw;
                height: 100dvh;
                overflow: hidden;
            }
        </style>
    </head>
    <body>
        <main id="app"></main>
        <script type="module" src="/demo/boot.ts"></script>
    </body>
</html>
